    <!-- ========== Fix absolute paths for Pages (runtime) ========== -->
    <script>
        // This script rewrites any same-origin absolute paths (starting with '/') to the repository base
        // so resources and fetch() calls work when the site is served as a project page (e.g. /nahgalawel2027/).
        (function(){
            try {
                var repoBase = '/';
                // If served from GitHub Pages (username.github.io/repo/), location.pathname starts with '/repo/'
                var pathParts = location.pathname.split('/').filter(Boolean);
                if (location.hostname === 'nahgalawel.github.io' && pathParts.length > 0) {
                    repoBase = '/' + pathParts[0] + '/';
                } else if (pathParts.length > 0 && pathParts[0] !== '') {
                    // In case it's hosted under a subpath, use first segment
                    repoBase = '/' + pathParts[0] + '/';
                }

                function fixAttr(el, attr) {
                    var val = el.getAttribute(attr);
                    if (!val) return;
                    if (val.startsWith('/') && !val.startsWith('//') && !val.match(/^https?:\/\//)) {
                        el.setAttribute(attr, repoBase + val.replace(/^\/+/, ''));
                    }
                }

                function fixExistingElements() {
                    var imgs = document.getElementsByTagName('img');
                    var scripts = document.getElementsByTagName('script');
                    var links = document.getElementsByTagName('link');
                    var aTags = document.getElementsByTagName('a');

                    Array.prototype.forEach.call(imgs, function(i){ fixAttr(i, 'src'); });
                    Array.prototype.forEach.call(scripts, function(s){ fixAttr(s, 'src'); });
                    Array.prototype.forEach.call(links, function(l){ fixAttr(l, 'href'); });
                    Array.prototype.forEach.call(aTags, function(a){ fixAttr(a, 'href'); });
                }

                // Patch fetch to rewrite same-origin absolute URLs
                var originalFetch = window.fetch;
                window.fetch = function(input, init) {
                    try {
                        if (typeof input === 'string') {
                            if (input.startsWith('/') && !input.startsWith('//')) {
                                input = repoBase + input.replace(/^\/+/, '');
                            }
                        } else if (input && input.url) {
                            var u = new URL(input.url, location.href);
                            if (u.origin === location.origin && u.pathname.startsWith('/')) {
                                var fixed = repoBase + u.pathname.replace(/^\/+/, '') + u.search + u.hash;
                                input = new Request(fixed, input);
                            }
                        }
                    } catch (e) {
                        // ignore
                    }
                    return originalFetch.call(this, input, init);
                };

                // Run on DOMContentLoaded to fix elements loaded in head/body
                document.addEventListener('DOMContentLoaded', function(){
                    try { fixExistingElements(); } catch(e) {}
                });

                // Also attempt immediate correction for elements already present
                try { fixExistingElements(); } catch(e) {}

                // expose helper if needed
                window.__nahj_repo_base = repoBase;
            } catch (e) {
                console.warn('Repo-base fixer failed', e);
            }
        })();
    </script>
